name: Revert to bbe7414

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert master to bbe7414
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin master
          git checkout master

          git revert --no-commit bbe7414caf429499d5f1bd7fed1d49e490e9014a..HEAD
          git commit -m "Revert to bbe7414caf429499d5f1bd7fed1d49e490e9014a" || echo "Nothing to revert"

          git push origin master
